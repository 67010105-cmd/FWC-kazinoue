<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>
<body>

    <table style="width: 100%; border-collapse: collapse; border: 1px solid black;">
        <tr>
            <td style="background-color: #a0cc0d; border: 1px solid black; padding: 20px; width: 50%;">
                First cell
            </td>
            <td style="background-color: #d26841; border: 1px solid black; padding: 20px; width: 50%;">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
