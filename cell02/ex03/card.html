<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>


    <div class="card">
        <table class="invisible-table">
            <tr>
                <td>
                    <img class="profile-img" src="DSC01477.JPG" alt="Profile">
                </td>
            </tr>
            <tr>
                <td>
                    <h3>kazinoue</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <p class="desc">Hello World!</p>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="socials">
                        <img src="https://www.iconpacks.net/icons/2/free-user-icon-3296-thumb.png" alt="icon1">
                        <img src="https://png.pngtree.com/png-vector/20260102/ourmid/pngtree-phone-icon-in-circle-shape-png-image_18386322.webp" alt="icon2">
                        <img src="https://marketplace.canva.com/qSn3A/MADQ1fqSn3A/2/tl/canva-mail-icon-MADQ1fqSn3A.png" alt="icon3">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
